<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151821" />
      <stop offset="50%" stop-color="#0f1117" />
      <stop offset="100%" stop-color="#090a0e" />
    </linearGradient>

    <!-- Emerald Supabase Glow Gradient -->
    <linearGradient id="supaBoltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3ef09d" />
      <stop offset="50%" stop-color="#3ecf8e" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="dbDiskGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3ecf8e" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#3ecf8e" stop-opacity="0.0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Container with Rounded Corner -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#2e3240" stroke-width="4" />

  <!-- Subtle Radial Glow in Center -->
  <circle cx="256" cy="256" r="180" fill="url(#accentGlow)" />

  <!-- Database Cylinder Stack in Background -->
  <g transform="translate(136, 120)" opacity="0.45">
    <!-- Cylinder 1 Top -->
    <path d="M 0,40 C 0,18 54,0 120,0 C 186,0 240,18 240,40 C 240,62 186,80 120,80 C 54,80 0,62 0,40 Z" fill="url(#dbDiskGrad)" stroke="#475569" stroke-width="3"/>
    <!-- Cylinder 1 Body -->
    <path d="M 0,40 V 80 C 0,102 54,120 120,120 C 186,120 240,102 240,80 V 40 C 240,62 186,80 120,80 C 54,80 0,62 0,40 Z" fill="#1e293b" stroke="#475569" stroke-width="3"/>

    <!-- Cylinder 2 Body -->
    <path d="M 0,110 V 150 C 0,172 54,190 120,190 C 186,190 240,172 240,150 V 110 C 240,132 186,150 120,150 C 54,150 0,132 0,110 Z" fill="#0f172a" stroke="#334155" stroke-width="3"/>

    <!-- Cylinder 3 Body -->
    <path d="M 0,180 V 220 C 0,242 54,260 120,260 C 186,260 240,242 240,220 V 180 C 240,202 186,220 120,220 C 54,220 0,202 0,180 Z" fill="#0f172a" stroke="#1e293b" stroke-width="3"/>
  </g>

  <!-- Glowing Emerald Supabase Lightning Bolt -->
  <g transform="translate(0, 0)" filter="url(#glow)">
    <path d="M 276,88 
             L 156,260 
             C 148,272 158,288 172,288 
             L 248,288 
             L 220,420 
             C 216,436 238,446 248,432 
             L 368,252 
             C 376,240 366,224 352,224 
             L 276,224 
             L 304,100 
             C 308,84 286,74 276,88 Z" 
          fill="url(#supaBoltGrad)" />
  </g>

  <!-- Status Pulse Indicator -->
  <circle cx="390" cy="120" r="14" fill="#3ef09d" filter="url(#glow)" />
  <circle cx="390" cy="120" r="8" fill="#ffffff" />
</svg>
