name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Verify Node
        run: |
          node -v
          npm -v

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify Gradle Wrapper
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "Error: android/gradlew file missing!"
            exit 1
          fi
          if [ ! -s "android/gradlew" ]; then
            echo "Error: android/gradlew file is empty or corrupted!"
            exit 1
          fi
          chmod +x android/gradlew

      - name: Verify Gradle Wrapper JAR
        run: |
          JAR_PATH="android/gradle/wrapper/gradle-wrapper.jar"
          echo "Checking $JAR_PATH..."
          
          if [ ! -f "$JAR_PATH" ] || [ ! -s "$JAR_PATH" ] || ! unzip -t "$JAR_PATH" >/dev/null 2>&1; then
            echo "Gradle wrapper JAR is missing or corrupted. Re-downloading..."
            mkdir -p android/gradle/wrapper
            curl -sSL "https://raw.githubusercontent.com/gradle/gradle/v8.14.3/gradle/wrapper/gradle-wrapper.jar" -o "$JAR_PATH" || \
            curl -sSL "https://repo.gradle.org/gradle/libs-releases-local/org/gradle/gradle-wrapper/8.14.3/gradle-wrapper-8.14.3.jar" -o "$JAR_PATH"
          fi

          if [ -s "$JAR_PATH" ]; then
            echo "Gradle wrapper JAR verified successfully."
          else
            echo "Error: Failed to verify or restore gradle-wrapper.jar"
            exit 1
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Read App Name
        run: |
          APP_NAME="Supan"
          SAFE_NAME=$(echo "$APP_NAME" | sed 's/[^a-zA-Z0-9._-]/_/g')
          echo "APP_NAME=$SAFE_NAME" >> $GITHUB_ENV

      - name: Rename APK
        run: |
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK tidak ditemukan!"
            exit 1
          fi

          cp "$APK" "android/app/build/outputs/apk/${{ env.APP_NAME }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}
          path: android/app/build/outputs/apk/${{ env.APP_NAME }}.apk
